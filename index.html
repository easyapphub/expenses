<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d8a">
<title>Közös kiadások</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#1b2130;--mute:#6b7488;--line:#e3e7ef;--z:#2f5d8a;--zs:#e3edf7;--v:#b4476b;--vs:#f8e6ed;--ok:#2e8b57;
--r:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b202b;--ink:#eef1f7;--mute:#9099ad;--line:#2b3242;--z:#6aa3d8;--zs:#1f3144;--v:#e57b9f;--vs:#3a2230;--ok:#58c28a}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);min-height:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
select,input{font:inherit;color:inherit}
.cur{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who button{padding:14px 8px;border-radius:12px;border:2px solid var(--line);background:var(--card);font:inherit;font-weight:650;font-size:17px;color:var(--ink);cursor:pointer}
.who button[data-p=Zoli][aria-pressed=true]{background:var(--zs);border-color:var(--z);color:var(--z)}
.who button[data-p=Veronika][aria-pressed=true]{background:var(--vs);border-color:var(--v);color:var(--v)}
label.l{display:block;font-size:14px;color:var(--mute);margin:14px 0 6px}
.amt{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:6px 14px;background:var(--card)}
.amt:focus-within{border-color:var(--ink)}
.amt input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:30px;font-weight:700;padding:6px 0;width:100%}
.amt span{font-size:18px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.txt{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);margin-top:10px}
.txt[hidden]{display:none}
.main{width:100%;margin-top:18px;padding:16px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:inherit;font-size:18px;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--z);outline-offset:2px}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot div{border-radius:12px;padding:12px}
.tot .z{background:var(--zs);color:var(--z)}.tot .v{background:var(--vs);color:var(--v)}
.tot b{display:block;font-size:22px;margin:2px 0}.tot small{font-size:12px;opacity:.8}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:14px 0 4px;background:var(--line)}
.bar i{display:block;transition:width .4s}.bar .a{background:var(--z)}.bar .b{background:var(--v)}
.res{font-size:17px;line-height:1.4;margin:12px 0 0;text-align:center}.res strong{font-size:24px;display:block;margin-top:4px}
.res.even{color:var(--ok);font-weight:650}
.settle{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:2px solid var(--ok);background:transparent;color:var(--ok);font:inherit;font-weight:700;cursor:pointer}
.settle:disabled{opacity:.35;cursor:default}
h2{font-size:17px;margin:0 0 6px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.Zoli{background:var(--z)}.dot.Veronika{background:var(--v)}
.info{flex:1;min-width:0}.info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info small{color:var(--mute);font-size:13px}.sum{font-weight:700;white-space:nowrap}
.del{border:0;background:transparent;color:var(--mute);font-size:22px;line-height:1;padding:6px 8px;cursor:pointer;border-radius:8px}
.old li{opacity:.6}.old li.set{opacity:1;color:var(--ok);font-weight:600}
details summary{cursor:pointer;font-weight:650;padding:2px 0}
.empty{color:var(--mute);padding:10px 0;text-align:center}
.toast{position:fixed;top:auto;right:auto;margin:0;border:0;width:max-content;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pill{display:block;width:100%;text-align:left;margin:-4px 0 14px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mute);font:inherit;font-size:14px;cursor:pointer}
.pill.ok{color:var(--ok)}.pill.err{color:#c0392b}
dialog{border:0;border-radius:var(--r);background:var(--card);color:var(--ink);width:min(92vw,480px);padding:18px}
dialog::backdrop{background:#0009}
dialog p,dialog ol{font-size:14px;color:var(--mute);line-height:1.45}dialog ol{padding-left:20px;margin:8px 0}
dialog .txt{margin-top:0}
.seg{display:flex;gap:6px;margin:8px 0 12px}
.seg button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi div{background:var(--bg);border-radius:12px;padding:10px}.kpi b{display:block;font-size:16px}.kpi small{color:var(--mute);font-size:12px}
h3{font-size:15px;margin:20px 0 4px}
.hb{margin:10px 0}.hb .t{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px}
.hb .t span:last-child{font-weight:700}.hb .t.p span{font-weight:400}.hb small{color:var(--mute)}
.hb .tr{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.hb .f{display:flex;height:100%;border-radius:6px;overflow:hidden}.hb .f i{display:block;height:100%}
.zc{background:var(--z)}.vc{background:var(--v)}
.cols{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:8px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.cols .stk{width:100%;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden}.cols .stk i{display:block;width:100%}
.cols small{font-size:12px;color:var(--mute);margin-top:4px}.cols .mv{font-size:11px;color:var(--mute);margin-bottom:3px}
.lg{display:flex;gap:14px;font-size:13px;color:var(--mute);margin:6px 0 2px}.lg .dot{display:inline-block;margin-right:6px}
.flags{display:flex;gap:8px}
.flags button{padding:3px;border:2px solid transparent;border-radius:9px;background:transparent;cursor:pointer;opacity:.45;line-height:0}
.flags button[aria-pressed=true]{opacity:1;border-color:var(--ink)}
.flags svg{width:36px;height:24px;border-radius:3px;box-shadow:0 0 0 1px var(--line)}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0;line-height:1.4}.hint:empty{display:none}#ownNote{text-align:center}
.info small{display:block;overflow-wrap:anywhere}
.undo{margin-left:auto;flex:none;padding:6px 10px;border-radius:9px;border:1.5px solid var(--ok);background:transparent;color:var(--ok);font:inherit;font-size:13px;font-weight:650;cursor:pointer}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{padding:13px 8px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:650;cursor:pointer}
dialog{max-height:90vh;overflow:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header><h1 data-i18n="title"></h1><div class="flags" id="lang">
<button type="button" data-l="hu" aria-label="Magyar" aria-pressed="false"><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><rect width="30" height="6.67" fill="#ce2939"/><rect y="13.33" width="30" height="6.67" fill="#477050"/></svg></button>
<button type="button" data-l="sk" aria-label="Slovenčina" aria-pressed="false"><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><rect y="6.67" width="30" height="6.67" fill="#0b4ea2"/><rect y="13.33" width="30" height="6.67" fill="#ee1c25"/><path d="M6 4.5h7v6.2c0 2.4-3.5 3.8-3.5 3.8S6 13.1 6 10.7z" fill="#ee1c25" stroke="#fff" stroke-width=".6"/><path d="M9.5 6v6M7.6 7.6h3.8M8 9.3h3" stroke="#fff" stroke-width=".9"/></svg></button>
</div></header>
<button class="pill" id="st" type="button"></button>

<section class="card" aria-label="Új költség">
<div class="who" id="who">
<button type="button" data-p="Zoli" aria-pressed="false">Zoli</button>
<button type="button" data-p="Veronika" aria-pressed="false">Veronika</button></div>
<label class="l" for="amount" data-i18n="amount"></label>
<div class="amt"><input id="amount" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><span>€</span></div>
<label class="l" for="own" data-i18n="ownLbl"></label>
<div class="amt" style="padding:2px 14px"><input id="own" type="text" inputmode="decimal" placeholder="0" autocomplete="off" style="font-size:20px"><span>€</span></div>
<p class="hint" data-i18n="ownHint"></p>
<label class="l" data-i18n="store"></label>
<div class="chips" id="stores"></div>
<input id="other" class="txt" type="text" data-ph="storeNamePh" placeholder="Üzlet neve" maxlength="40" hidden>
<label class="l" for="date" data-i18n="time"></label>
<input id="date" class="txt" type="datetime-local" style="margin-top:0">
<label class="l" for="note" data-i18n="noteLbl"></label>
<input id="note" class="txt" type="text" maxlength="80" data-ph="notePh" autocomplete="off" style="margin-top:0">
<button class="main" id="add" type="button" data-i18n="save"></button>
</section>

<section class="card" aria-label="Egyenleg">
<div class="tot"><div class="z"><small data-i18n="zPaid"></small><b id="tz">0</b><small id="az"></small></div>
<div class="v"><small data-i18n="vPaid"></small><b id="tv">0</b><small id="av"></small></div></div>
<div class="bar"><i class="a" id="ba" style="width:50%"></i><i class="b" id="bb" style="width:50%"></i></div>
<p class="res" id="res"></p>
<p class="hint" id="ownNote"></p>
<button class="settle" id="settle" type="button" data-i18n="settleBtn"></button>
</section>

<section class="card" aria-label="Napló">
<h2 data-i18n="log"></h2><ul id="log"></ul>
<details class="old" id="oldBox" hidden style="margin-top:12px"><summary data-i18n="old"></summary><ul id="old"></ul></details>
</section>

<section class="card" aria-label="Statisztika">
<h2 data-i18n="stats"></h2>
<div class="seg" id="range"><button type="button" data-r="all" aria-pressed="true" data-i18n="all"></button><button type="button" data-r="month" aria-pressed="false" data-i18n="thisMonth"></button></div>
<div id="stats"></div>
</section>

<section class="card" aria-label="Tools"><div class="tools"><button class="sec" id="rcBtn" type="button" data-i18n="rcBtn"></button><button class="sec" id="csvBtn" type="button" data-i18n="csvBtn"></button></div></section>
</main>
<dialog id="ed"><h2 data-i18n="edTitle"></h2>
<div class="who" id="edWho"><button type="button" data-p="Zoli" aria-pressed="false">Zoli</button><button type="button" data-p="Veronika" aria-pressed="false">Veronika</button></div>
<label class="l" for="edAmt" data-i18n="amount"></label><input id="edAmt" class="txt" type="text" inputmode="decimal" autocomplete="off">
<label class="l" for="edOwn" data-i18n="ownLbl"></label><input id="edOwn" class="txt" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
<label class="l" for="edStore" data-i18n="store"></label><input id="edStore" class="txt" type="text" list="sl" maxlength="40" autocomplete="off"><datalist id="sl"></datalist>
<label class="l" for="edDate" data-i18n="time"></label><input id="edDate" class="txt" type="datetime-local">
<label class="l" for="edNote" data-i18n="noteLbl"></label><input id="edNote" class="txt" type="text" maxlength="80" autocomplete="off">
<button class="main" id="edSave" type="button" data-i18n="saveEdit"></button>
<button class="settle" id="edCancel" data-i18n="cancel" type="button" style="border-color:var(--line);color:var(--mute);margin-top:8px"></button></dialog>
<dialog id="rc"><h2 data-i18n="rcBtn"></h2><p data-i18n="rcP"></p><ul id="rcList"></ul>
<div class="who" id="rcWho" style="margin-top:12px"><button type="button" data-p="Zoli" aria-pressed="false">Zoli</button><button type="button" data-p="Veronika" aria-pressed="false">Veronika</button></div>
<label class="l" for="rcAmt" data-i18n="amount"></label><input id="rcAmt" class="txt" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
<label class="l" for="rcName" data-i18n="rcNameLbl"></label><input id="rcName" class="txt" type="text" maxlength="40" autocomplete="off">
<label class="l" for="rcDayIn" data-i18n="rcDayLbl"></label><input id="rcDayIn" class="txt" type="number" min="1" max="28" value="1">
<button class="main" id="rcAdd" type="button" data-i18n="rcAdd"></button>
<button class="settle" id="rcClose" data-i18n="close" type="button" style="border-color:var(--line);color:var(--mute);margin-top:8px"></button></dialog>
<dialog id="dlg">
<h2 data-i18n="dlgTitle"></h2>
<p data-i18n="dlgP"></p>
<label class="l" for="ghRepo" data-i18n="repoLbl"></label>
<input id="ghRepo" class="txt" type="text" placeholder="zoli/kozos-adatok" autocapitalize="off" autocomplete="off">
<label class="l" for="ghPath" data-i18n="fileLbl"></label>
<input id="ghPath" class="txt" type="text" value="data.json" autocapitalize="off" autocomplete="off">
<label class="l" for="ghTok">Token</label>
<input id="ghTok" class="txt" type="password" placeholder="github_pat_…" autocomplete="off">
<details style="margin-top:12px"><summary data-i18n="howTo"></summary>
<ol><li>GitHub → Settings → Developer settings → Fine-grained tokens → Generate new token.</li>
<li data-i18n="ol2"></li>
<li>Permissions → Contents: Read and write.</li>
<li data-i18n="ol4"></li></ol></details>
<button class="main" id="ghSave" type="button" data-i18n="ghSave"></button>
<button class="settle" id="ghOff" data-i18n="ghOff" type="button" style="border-color:var(--line);color:var(--mute)">Szinkron kikapcsolása</button>
<button class="settle" id="ghClose" data-i18n="cancel" type="button" style="border-color:var(--line);color:var(--mute);margin-top:8px">Mégse</button>
</dialog>
<dialog id="cf"><p id="cfMsg" style="font-size:17px;color:var(--ink);margin:0 0 4px"></p>
<button class="main" id="cfOk" type="button">OK</button>
<button class="settle" id="cfNo" data-i18n="cancel" type="button" style="border-color:var(--line);color:var(--mute);margin-top:8px">Mégse</button></dialog>
<div class="toast" id="toast" popover="manual" role="status"></div>
